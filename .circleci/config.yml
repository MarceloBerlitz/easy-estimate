version: 2.1

executors:
  my-executor:
    docker:
      - image: node:18-alpine
    working_directory: /project

jobs:
  build:
    executor: my-executor
    steps:
      - checkout
      - run:
          command: yarn test
          name: Run tests
      - run:
          command: npm i typescript -g
          name: Install tsc
      - run:
          command: npm i react-scripts -g
          name: Install react-scripts
      - run:
          command: yarn build
          name: Build app
      - persist_to_workspace:
          root: easy-estimate
          paths: .
  deploy:
    executor: my-executor
    steps:
      - attach_workspace:
        at: /project/easy-estimate
      - run:
          name: Deploy app
          command: |
            scp -r ./packages/server/dist/ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/.
